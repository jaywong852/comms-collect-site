<!DOCTYPE html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>日誌表｜每月活動一覽</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">樂</div>
          <div>
            <h1>通訊稿收集</h1>
          </div>
        </div>
        <div class="top-actions">
          <a class="btn btn-nav" href="/">主頁</a>
        </div>
      </header>

      <section class="card hero">
        <h2 id="period-title">載入緊…</h2>
        <div class="period-page-nav">
          <a class="btn btn-nav" id="submit-link" href="/submit">新增活動</a>
          <a class="btn btn-nav" id="manage-link" href="/manage">活動一覽</a>
          <a class="btn btn-nav is-active" id="calendar-link" href="/calendar" aria-current="page">日誌表</a>
        </div>
        <p>
          格內顯示<strong>活動編號</strong>、<strong>活動名稱</strong>同<strong>時間</strong>（日期即係格本身），例如：27. 開心相聚生日會。
          改咗編號／名稱／日期／時間之後，呢度會自動更新。
        </p>
        <div class="hero-actions">
          <button class="btn btn-secondary" type="button" id="export-btn">匯出</button>
        </div>
      </section>

      <div id="months"></div>

      <section class="card" id="unplaced-card" hidden>
        <h3 class="section-title">未入日誌表（日期未填／未能辨識）</h3>
        <div class="list" id="unplaced-list"></div>
      </section>
    </div>
    <div class="modal-backdrop" id="auth-modal" aria-hidden="true">
      <div class="modal auth-modal" role="dialog" aria-modal="true" aria-label="後台登入">
        <div class="login-box auth-modal-box" id="auth-panel"></div>
      </div>
    </div>
    <script src="/periods.js"></script>
    <script src="/auth-ui.js"></script>
    <script src="/calendar.js"></script>
  </body>
</html>
